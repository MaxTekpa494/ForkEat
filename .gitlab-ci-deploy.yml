# Pipeline GitLab CI pour le déploiement en production uniquement
image: maven:3.9-eclipse-temurin-25-alpine

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "feat/production-pipeline" && $CI_PIPELINE_SOURCE == "push"

stages:
  - deploy

build-and-push-api:
  stage: build
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  services:
    - docker:dind
  before_script:
    - apk add --no-cache docker docker-compose
    - echo "$DEPLOY_TOKEN_PASSWORD" | docker login -u "$DEPLOY_TOKEN_USERNAME" --password-stdin registry.gitlab.com
  script:
    - cd backend && docker build -t registry.gitlab.com/adben27/projet-recettes-uge .
    - docker push registry.gitlab.com/adben27/projet-recettes-uge

deploy-prod:
  stage: deploy
  before_script:
    # Ajout de la clé privée SSH pour la connexion au serveur
    - 'echo "$SSH_PRIVATE_KEY" > id_rsa && chmod 600 id_rsa'
    # Ajout du serveur à known_hosts pour éviter les prompts
    - 'ssh-keyscan -H $DEPLOY_SERVER_IP >> ~/.ssh/known_hosts'
    # Copier le fichier .env de production sur le serveur
    - 'scp -i id_rsa -o StrictHostKeyChecking=no $PROD_DOTENV_FILE $DEPLOY_SERVER_USERNAME@$DEPLOY_SERVER_IP:/home/$DEPLOY_SERVER_USERNAME/projet-recettes-uge/backend/.env'
  script:
    # Se connecter au registry, pull la dernière image, puis lancer docker compose
    - 'ssh -i id_rsa $DEPLOY_SERVER_USERNAME@$DEPLOY_SERVER_IP "cd /home/$DEPLOY_SERVER_USERNAME/projet-recettes-uge/backend && git fetch origin main && git reset --hard origin/main && docker login $CI_REGISTRY -u $DEPLOY_TOKEN_USERNAME -p $DEPLOY_TOKEN_PASSWORD && docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d"'