services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: forkeat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forkeat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_reservation: 1g
    mem_limit: 3g

  neo4j:
    image: neo4j:5
    container_name: forkeat-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - forkeat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_reservation: 2g
    mem_limit: 4g
  ollama:
    build:
      dockerfile_inline: |
        FROM ollama/ollama:0.18.2
        RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
    container_name: forkeat-ollama
    ports:
      - "11435:11434"
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - forkeat-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    mem_reservation: 4g
    mem_limit: 8g

  ollama-init:
    image: ollama/ollama:0.18.2
    container_name: forkeat-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull bge-m3 &&
       ollama pull llama-guard3:1b &&
       echo 'Tous les modèles Ollama sont prêts.'"
    networks:
      - forkeat-network
    restart: "no"
    mem_reservation: 256m
    mem_limit: 1g

  stripe:
    image: stripe/stripe-cli:v1.38.1
    container_name: forkeat-stripe
    environment:
      STRIPE_API_KEY: ${STRIPE_API_KEY}
      STRIPE_BASE_URL: ${STRIPE_BASE_URL}
    command: listen --forward-to ${STRIPE_BASE_URL}/api/wallet/webhooks/stripe
    networks :
      - forkeat-network
    mem_reservation: 64m
    mem_limit: 256m

volumes:
  postgres_data:
  neo4j_data:
  ollama_data:

networks:
  forkeat-network:
    driver: bridge