services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: forkeat-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forkeat-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: forkeat-neo4j
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
    networks:
      - forkeat-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
  ollama:
    image: forkeat/ollama:latest
    build:
      dockerfile_inline: |
        FROM ollama/ollama:latest
        RUN apt-get update && apt-get install -y curl && rm -rf /var/lib/apt/lists/*
    container_name: forkeat-ollama
    ports:
      - "11435:11434"
    volumes:
      - ./ollama:/root/.ollama
    networks:
      - forkeat-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:11434/api/tags" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  ollama-init:
    image: ollama/ollama:latest
    container_name: forkeat-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull bge-m3 &&
       ollama pull llama-guard3:1b &&
       echo 'Tous les modèles Ollama sont prêts.'"
    networks:
      - forkeat-network
    restart: "no"

volumes:
  postgres_data:
  neo4j_data:
  ollama_data:

networks:
  forkeat-network:
    driver: bridge
