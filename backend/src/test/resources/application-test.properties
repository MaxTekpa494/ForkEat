# Configuration de test - les valeurs seront overridées par Testcontainers
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Désactiver Neo4j pour les tests JPA
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration,org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.testcontainers=INFO

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=600000

app.admin.password=admin
app.admin.username=admin

