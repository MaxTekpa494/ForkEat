# Configuration de test - les valeurs seront overridï¿½es par Testcontainers
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/testmigration

# Logging
logging.level.org.hibernate.SQL=WARN
logging.level.org.testcontainers=INFO
logging.level.org.springframework.data.neo4j.cypher.unrecognized=ERROR
logging.level.io.debezium.connector.postgresql.TypeRegistry=ERROR

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=600000

app.admin.password=admin
app.admin.username=admin

# --- STRIPE ---
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# --- DEBEZIUM ---
debezium.enabled=false

# --- APPLICATION ---
app.front.url=http://localhost:4200
app.base-url=http://localhost:8080

spring.mail.host=
spring.mail.port=
spring.mail.test-connection=false

# --- OLLAMA / RAG ---
spring.ai.ollama.init.pull-model-strategy=never