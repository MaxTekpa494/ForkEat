<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Code de vérification - ForkEat</title>
</head>
<body>
<div layout:fragment="content">

    <div class="min-h-[calc(100vh-80px)] flex">

        <div class="flex-1 flex flex-col justify-center py-12 px-4 sm:px-6 lg:px-20 xl:px-24 bg-surface">
            <div class="mx-auto w-full max-w-sm lg:w-96">

                <div class="text-center md:text-left">
                    <h2 class="font-display font-bold text-3xl text-secondary-900">
                        Vérifiez votre email
                    </h2>
                    <p class="mt-2 text-sm text-gray-600">
                        Entrez le code à 6 chiffres envoyé à votre adresse
                    </p>
                </div>

                <!-- Messages d'erreur/succès -->
                <div th:if="${param.error}" class="mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-md animate-fadeInUp">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas fa-exclamation-circle text-red-500"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-red-700 font-medium">Code incorrect ou expiré</p>
                        </div>
                    </div>
                </div>

                <div th:if="${error}" class="mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-md animate-fadeInUp">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas fa-exclamation-circle text-red-500"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-red-700 font-medium" th:text="${error}">Erreur</p>
                        </div>
                    </div>
                </div>

                <div th:if="${success}" class="mt-4 bg-green-50 border-l-4 border-green-500 p-4 rounded-md animate-fadeInUp">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas fa-check-circle text-green-500"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-green-700 font-medium" th:text="${success}">Code vérifié !</p>
                        </div>
                    </div>
                </div>

                <!-- Info code envoyé -->
                <div th:if="${email}" class="mt-4 bg-blue-50 border-l-4 border-blue-500 p-4 rounded-md animate-fadeInUp">
                    <div class="flex">
                        <div class="flex-shrink-0">
                            <i class="fas fa-paper-plane text-blue-500"></i>
                        </div>
                        <div class="ml-3">
                            <p class="text-sm text-blue-700 font-medium">
                                Code envoyé à <span class="font-bold" th:text="${email}"></span>
                            </p>
                        </div>
                    </div>
                </div>

                <div class="mt-8">

                    <!-- Form de vérification -->
                    <form th:action="@{/auth/forgot-password-verify-code}" method="POST" class="space-y-6" id="verifyForm">

                        <div>
                            <label class="block text-sm font-medium text-secondary-900 mb-3">
                                Code de vérification
                            </label>
                            <div class="flex gap-2 justify-between" id="codeInputs">
                                <input type="text" maxlength="1"
                                       class="code-input w-14 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition"
                                       pattern="[0-9]" inputmode="numeric" required>
                                <input type="text" maxlength="1"
                                       class="code-input w-14 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition"
                                       pattern="[0-9]" inputmode="numeric" required>
                                <input type="text" maxlength="1"
                                       class="code-input w-14 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition"
                                       pattern="[0-9]" inputmode="numeric" required>
                                <input type="text" maxlength="1"
                                       class="code-input w-14 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition"
                                       pattern="[0-9]" inputmode="numeric" required>
                                <input type="text" maxlength="1"
                                       class="code-input w-14 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition"
                                       pattern="[0-9]" inputmode="numeric" required>
                                <input type="text" maxlength="1"
                                       class="code-input w-14 h-16 text-center text-2xl font-bold border-2 border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500 transition"
                                       pattern="[0-9]" inputmode="numeric" required>
                            </div>
                            <!-- Hidden input pour envoyer le code complet au serveur -->
                            <input type="hidden" id="verificationCode" name="verificationCode">
                        </div>

                        <!-- Message d'erreur de validation côté client -->
                        <div id="codeError" class="hidden bg-red-50 border-l-4 border-red-500 p-4 rounded-md">
                            <div class="flex">
                                <div class="flex-shrink-0">
                                    <i class="fas fa-exclamation-circle text-red-500"></i>
                                </div>
                                <div class="ml-3">
                                    <p class="text-sm text-red-700 font-medium" id="codeErrorText"></p>
                                </div>
                            </div>
                        </div>

                        <div>
                            <button type="submit"
                                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-lg text-sm font-bold text-white bg-primary-500 hover:bg-primary-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500 transition transform hover:-translate-y-0.5">
                                Vérifier le code
                            </button>
                        </div>
                    </form>

                    <!-- Lien retour -->
                    <div class="mt-6">
                        <div class="relative">
                            <div class="absolute inset-0 flex items-center">
                                <div class="w-full border-t border-gray-300"></div>
                            </div>
                            <div class="relative flex justify-center text-sm">
                                <span class="px-2 bg-surface text-gray-500">
                                    Mauvaise adresse ?
                                </span>
                            </div>
                        </div>

                        <div class="mt-6">
                            <a th:href="@{/auth/forgot-password}"
                               class="w-full flex justify-center py-3 px-4 border-2 border-secondary-100 rounded-full shadow-sm text-sm font-bold text-secondary-700 bg-white hover:bg-secondary-50 hover:border-secondary-200 transition">
                                <i class="fas fa-arrow-left mr-2"></i>
                                Retour
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Image côté droit -->
        <div class="hidden lg:block relative w-0 flex-1 overflow-hidden">
            <img class="absolute inset-0 h-full w-full object-cover"
                 src="https://www.lejournaldelamaison.fr/wp-content/uploads/sites/8/2025/12/cuisines-blanches-depassees-ces-tendances-cuisine-2026-vont-transformer-votre-cuisine-sans-tout-refaire.jpeg"
                 alt="Cuisine ambiance">

            <div class="absolute inset-0 bg-secondary-900/80 mix-blend-multiply"></div>

            <div class="absolute inset-0 flex flex-col justify-center items-center text-center p-12">
                <div class="bg-white/10 backdrop-blur-md border border-white/20 p-8 rounded-3xl max-w-lg shadow-2xl">
                    <i class="fas fa-envelope-open-text text-primary-500 text-4xl mb-4"></i>

                    <p class="text-xl text-white font-display italic mb-6">
                        "Vérifiez votre boîte mail. Si vous ne voyez pas l'email, pensez à vérifier vos spams."
                    </p>
                    <div class="flex items-center justify-center space-x-3">
                        <div class="h-10 w-10 rounded-full bg-primary-500 flex items-center justify-center text-white font-bold">F</div>
                        <div class="text-left">
                            <p class="text-white font-bold text-sm">Équipe ForkEat</p>
                            <p class="text-primary-200 text-xs">Support Sécurité</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Gestion des inputs du code de vérification
        const codeInputs = document.querySelectorAll('.code-input');

        // Focus automatique sur le premier champ au chargement
        if (codeInputs.length > 0) {
            codeInputs[0].focus();
        }

        codeInputs.forEach((input, index) => {
            // Focus automatique sur le champ suivant
            input.addEventListener('input', (e) => {
                const value = e.target.value;

                // Autoriser uniquement les chiffres
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                if (value.length === 1 && index < codeInputs.length - 1) {
                    codeInputs[index + 1].focus();
                }

                // Mettre à jour le champ caché avec le code complet
                updateVerificationCode();
            });

            // Gestion du backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    codeInputs[index - 1].focus();
                }
            });

            // Coller un code complet
            input.addEventListener('paste', (e) => {
                e.preventDefault();
                const pastedData = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 6);

                pastedData.split('').forEach((char, i) => {
                    if (codeInputs[i]) {
                        codeInputs[i].value = char;
                    }
                });

                // Focus sur le dernier champ rempli ou le suivant
                const nextIndex = Math.min(pastedData.length, codeInputs.length - 1);
                codeInputs[nextIndex].focus();

                updateVerificationCode();
            });
        });

        function updateVerificationCode() {
            const code = Array.from(codeInputs).map(input => input.value).join('');
            document.getElementById('verificationCode').value = code;
        }

        // Validation côté client
        document.getElementById('verifyForm').addEventListener('submit', function(e) {
            const verificationCode = document.getElementById('verificationCode').value;
            const errorDiv = document.getElementById('codeError');
            const errorText = document.getElementById('codeErrorText');

            // Réinitialiser l'affichage d'erreur
            errorDiv.classList.add('hidden');

            // Vérifier le code de vérification
            if (verificationCode.length !== 6 || !/^\d{6}$/.test(verificationCode)) {
                e.preventDefault();
                errorText.textContent = 'Veuillez entrer un code à 6 chiffres';
                errorDiv.classList.remove('hidden');

                // Secouer les inputs
                document.getElementById('codeInputs').classList.add('animate-shake');
                setTimeout(() => {
                    document.getElementById('codeInputs').classList.remove('animate-shake');
                }, 500);

                return;
            }
        });

        // Fonction pour renvoyer le code
        let canResend = true;
        let resendTimeout;

        function resendVerificationCode() {
            if (!canResend) return;

            const email = document.getElementById('email').value;
            if (!email) {
                const errorDiv = document.getElementById('codeError');
                const errorText = document.getElementById('codeErrorText');
                errorText.textContent = 'Veuillez entrer votre adresse email';
                errorDiv.classList.remove('hidden');
                return;
            }

            // Appel AJAX pour renvoyer le code
            fetch('/auth/resend-verification-code', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ email: email })
            })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Afficher un message de succès temporaire
                        const successDiv = document.createElement('div');
                        successDiv.className = 'mt-4 bg-green-50 border-l-4 border-green-500 p-4 rounded-md animate-fadeInUp';
                        successDiv.innerHTML = `
                        <div class="flex">
                            <div class="flex-shrink-0">
                                <i class="fas fa-check-circle text-green-500"></i>
                            </div>
                            <div class="ml-3">
                                <p class="text-sm text-green-700 font-medium">Un nouveau code a été envoyé !</p>
                            </div>
                        </div>
                    `;

                        const form = document.getElementById('verifyForm');
                        form.parentNode.insertBefore(successDiv, form);

                        // Retirer le message après 5 secondes
                        setTimeout(() => successDiv.remove(), 5000);

                        // Désactiver le bouton pendant 60 secondes
                        startResendCountdown();
                    } else {
                        const errorDiv = document.getElementById('codeError');
                        const errorText = document.getElementById('codeErrorText');
                        errorText.textContent = 'Erreur lors de l\'envoi du code. Veuillez réessayer.';
                        errorDiv.classList.remove('hidden');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    const errorDiv = document.getElementById('codeError');
                    const errorText = document.getElementById('codeErrorText');
                    errorText.textContent = 'Erreur lors de l\'envoi du code. Veuillez réessayer.';
                    errorDiv.classList.remove('hidden');
                });
        }

        function startResendCountdown() {
            canResend = false;
            const resendBtn = document.getElementById('resendCode');
            const timerDiv = document.getElementById('resendTimer');
            const countdownSpan = document.getElementById('countdown');

            resendBtn.disabled = true;
            resendBtn.classList.add('opacity-50', 'cursor-not-allowed');
            timerDiv.classList.remove('hidden');

            let timeLeft = 60;
            countdownSpan.textContent = timeLeft;

            resendTimeout = setInterval(() => {
                timeLeft--;
                countdownSpan.textContent = timeLeft;

                if (timeLeft <= 0) {
                    clearInterval(resendTimeout);
                    canResend = true;
                    resendBtn.disabled = false;
                    resendBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    timerDiv.classList.add('hidden');
                }
            }, 1000);
        }
    </script>

    <style>
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .animate-shake {
            animation: shake 0.5s;
        }
    </style>

</div>
</body>
</html>
