<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Code de vérification - ForkEat</title>
</head>
<body>
<div layout:fragment="content">

    <section class="min-h-[70vh] flex items-center justify-center bg-surface py-12">
        <div class="max-w-md w-full mx-auto px-4">

            <!-- Flash messages -->
            <div th:if="${error}" class="mb-4 bg-red-50 border border-red-200 rounded-xl p-4">
                <div class="flex items-center space-x-3">
                    <i class="fas fa-exclamation-circle text-red-500"></i>
                    <p class="text-red-700 text-sm" th:text="${error}"></p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 text-center">

                <div class="w-20 h-20 bg-secondary-50 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-shield-alt text-secondary-800 text-3xl"></i>
                </div>

                <h1 class="font-display font-bold text-2xl text-secondary-900 mb-3">
                    Code de vérification
                </h1>

                <p class="text-gray-600 mb-2" th:if="${infoMessage}" th:text="${infoMessage}">
                    Un code a été envoyé.
                </p>

                <p class="text-gray-600 mb-6" th:unless="${infoMessage}">
                    Entrez le code à 6 chiffres envoyé à votre adresse email.
                </p>

                <form th:if="${actionType == 'PASSWORD_CHANGE'}"
                      th:action="@{/account/password-change-requests/confirm}" method="post" class="space-y-6">
                    <div>
                        <input type="text" name="code" required
                               pattern="[0-9]{6}" maxlength="6"
                               placeholder="000000"
                               autocomplete="one-time-code"
                               class="block w-full text-center text-3xl tracking-[0.5em] font-bold px-4 py-4 border-2 border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                    </div>

                    <button type="submit"
                            class="w-full bg-primary-500 hover:bg-primary-600 text-white px-6 py-3 rounded-full font-bold transition shadow-md">
                        <i class="fas fa-check mr-2"></i>
                        Confirmer le changement de mot de passe
                    </button>
                </form>

                <form th:if="${actionType == 'EMAIL_CHANGE'}"
                      th:action="@{/account/email-change-requests/confirm}" method="post" class="space-y-6">
                    <div>
                        <input type="text" name="code" required
                               pattern="[0-9]{6}" maxlength="6"
                               placeholder="000000"
                               autocomplete="one-time-code"
                               class="block w-full text-center text-3xl tracking-[0.5em] font-bold px-4 py-4 border-2 border-gray-200 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
                    </div>

                    <button type="submit"
                            class="w-full bg-primary-500 hover:bg-primary-600 text-white px-6 py-3 rounded-full font-bold transition shadow-md">
                        <i class="fas fa-check mr-2"></i>
                        Confirmer le changement d'email
                    </button>
                </form>

                <div class="mt-6 pt-6 border-t border-gray-100">
                    <div class="flex items-center justify-center space-x-2 text-sm text-gray-500">
                        <i class="fas fa-clock"></i>
                        <span>Ce code expire dans 10 minutes</span>
                    </div>
                </div>

                <a th:href="@{/account}"
                   class="inline-block mt-4 text-sm text-gray-500 hover:text-gray-700 transition">
                    <i class="fas fa-arrow-left mr-1"></i> Retour au profil
                </a>

            </div>
        </div>
    </section>

</div>
</body>
</html>
