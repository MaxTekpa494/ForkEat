<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Accès refusé - ForkEat</title>
</head>
<body>
<div layout:fragment="content">

    <section class="min-h-[70vh] flex items-center justify-center bg-surface py-12">
        <div class="max-w-md w-full mx-auto px-4">
            <div class="bg-white rounded-2xl shadow-xl border border-gray-100 p-8 text-center">

                <!-- Icône -->
                <div class="w-20 h-20 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-6">
                    <i class="fas fa-lock text-red-400 text-3xl"></i>
                </div>

                <p class="text-6xl font-display font-bold text-gray-100 mb-2">403</p>

                <h1 class="font-display font-bold text-2xl text-secondary-900 mb-3">
                    Accès refusé
                </h1>

                <p class="text-gray-600 mb-8">
                    Vous n'avez pas les droits nécessaires pour accéder à cette page.
                    Si vous pensez qu'il s'agit d'une erreur, contactez un administrateur.
                </p>

                <div class="space-y-3">
                    <a th:href="@{/recipes}"
                       class="block w-full bg-primary-500 hover:bg-primary-600 text-white px-6 py-3 rounded-full font-bold transition shadow-md">
                        <i class="fas fa-home mr-2"></i>
                        Retour aux recettes
                    </a>
                    <a href="javascript:history.back()"
                       class="block w-full border-2 border-secondary-100 text-secondary-700 hover:bg-secondary-50 px-6 py-3 rounded-full font-semibold transition">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Page précédente
                    </a>
                </div>

            </div>
        </div>
    </section>

</div>
</body>
</html>
