<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Requête invalide</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 50px; }
        .error-container { border: 1px solid #ddd; padding: 20px; border-radius: 8px; display: inline-block; }
        h1 { color: #f0ad4e; }
        .actions { margin-top: 20px; }
    </style>
</head>
<body>

<div class="error-container">
    <h1>Oups ! 400</h1>

    <p th:text="${errorMessage}">La requête est invalide.</p>

    <div class="actions">
        <a href="/" th:href="@{/}">Retour à l'accueil</a>
    </div>
</div>

</body>
</html>
