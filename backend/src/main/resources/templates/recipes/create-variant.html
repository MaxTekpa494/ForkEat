<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head>
    <title>Créer une variante - ForkEat</title>
</head>
<body>
<div layout:fragment="content">

    <section class="bg-gradient-to-br from-secondary-800 to-secondary-900 text-white py-16">
        <div class="container mx-auto px-4 max-w-3xl text-center">
            <h1 class="font-display font-bold text-3xl md:text-4xl mb-3" th:text="${formTitle}">
                Créer une variante
            </h1>
            <p class="text-secondary-200 text-lg">
                Proposez votre version de cette recette.
            </p>
        </div>
    </section>

    <section class="py-12 bg-surface">
        <div class="container mx-auto px-4 max-w-3xl">

            <div th:if="${recipeBase != null}" class="mb-6 rounded-xl bg-primary-50 border border-primary-200 p-4">
                <div class="flex items-center">
                    <i class="fas fa-code-branch text-primary-500 mr-2"></i>
                    <p class="text-sm text-primary-700">
                        Variante de
                        <a th:href="@{/recipes/{id}(id=${recipeBase.id})}"
                           th:text="${recipeBase.title}"
                           class="font-semibold hover:underline">
                            Recette parente
                        </a>
                        <span th:if="${recipeBase.username != null}"
                              th:text="' par ' + ${recipeBase.username}"
                              class="text-primary-600"></span>
                    </p>
                </div>
            </div>

            <div th:if="${errorMessage}" class="mb-6 rounded-xl bg-red-50 border border-red-200 p-4">
                <div class="flex items-center">
                    <i class="fas fa-exclamation-circle text-red-500 mr-2"></i>
                    <p th:text="${errorMessage}" class="text-sm text-red-700"></p>
                </div>
            </div>

            <div th:replace="~{recipes/form-fragment :: recipeForm}"></div>

        </div>
    </section>

</div>
</body>
</html>
