<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="recipeCard(recipe)" class="recipe-card relative group">

    <div class="bg-white rounded-2xl shadow-sm group-hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 h-full flex flex-col">

        <!-- Image -->
        <div class="aspect-[4/3] bg-secondary-100 overflow-hidden relative">
            <img th:if="${recipe.imageUrl != null and !recipe.imageUrl.isEmpty()}"
                 th:src="${recipe.imageUrl}"
                 th:alt="${recipe.title}"
                 class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
            <div th:unless="${recipe.imageUrl != null and !recipe.imageUrl.isEmpty()}"
                 class="w-full h-full flex items-center justify-center bg-gradient-to-br from-secondary-50 to-secondary-100">
                <i class="fas fa-utensils text-4xl text-secondary-300"></i>
            </div>

            <div class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1 rounded-full text-sm font-medium text-secondary-800 shadow-sm">
                <i class="fas fa-clock mr-1 text-primary-500"></i>
                <span th:text="${recipe.preparationMinutes + ' min'}">30 min</span>
            </div>
        </div>

        <div class="p-5 flex-1 flex flex-col">
            <h3 class="font-bold text-lg text-secondary-900 mb-2 line-clamp-1 group-hover:text-primary-500 transition">
                <span th:text="${recipe.title}">Titre de la recette</span>
            </h3>

            <p th:if="${recipe.summary != null and !recipe.summary.isEmpty()}"
               class="text-secondary-500 text-sm mb-4 line-clamp-2 flex-1"
               th:text="${recipe.summary}">
                Description de la recette...
            </p>

            <div class="flex items-center justify-between pt-4 border-t border-gray-100 mt-auto">
                <div class="flex items-center space-x-4">
                    <!-- Like -->
                    <span class="flex items-center space-x-1 text-sm text-secondary-500">
                        <i th:class="${recipe.likedByCurrentUser} ? 'fas fa-heart text-red-500' : 'far fa-heart text-gray-300'"></i>
                        <span th:text="${recipe.likeCount}">0</span>
                    </span>
                    <!-- Super-like -->
                    <span class="flex items-center space-x-1 text-sm text-secondary-500">
                        <svg th:if="${recipe.superLikedByCurrentUser}" class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                            <path d="M12 3C9.5 3 7.5 4.5 7 6.5C4.5 6.5 2.5 8.5 2.5 11C2.5 13.5 4.5 15.5 7 15.5H17C19.5 15.5 21.5 13.5 21.5 11C21.5 8.5 19.5 6.5 17 6.5C16.5 4.5 14.5 3 12 3Z" fill="#FFC837"/>
                            <path d="M7 16.5H17C17.55 16.5 18 16.95 18 17.5V19.5C18 20.05 17.55 20.5 17 20.5H7C6.45 20.5 6 20.05 6 19.5V17.5C6 16.95 6.45 16.5 7 16.5Z" fill="#FFC837"/>
                            <path d="M19 2L19.5 3.5L21 4L19.5 4.5L19 6L18.5 4.5L17 4L18.5 3.5L19 2Z" fill="#FFED8B"/>
                        </svg>
                        <svg th:unless="${recipe.superLikedByCurrentUser}" class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                            <path d="M12 3C9.5 3 7.5 4.5 7 6.5C4.5 6.5 2.5 8.5 2.5 11C2.5 13.5 4.5 15.5 7 15.5H17C19.5 15.5 21.5 13.5 21.5 11C21.5 8.5 19.5 6.5 17 6.5C16.5 4.5 14.5 3 12 3Z" fill="#D1D5DB"/>
                            <path d="M7 16.5H17C17.55 16.5 18 16.95 18 17.5V19.5C18 20.05 17.55 20.5 17 20.5H7C6.45 20.5 6 20.05 6 19.5V17.5C6 16.95 6.45 16.5 7 16.5Z" fill="#D1D5DB"/>
                            <path d="M19 2L19.5 3.5L21 4L19.5 4.5L19 6L18.5 4.5L17 4L18.5 3.5L19 2Z" fill="#D1D5DB"/>
                        </svg>
                        <span th:text="${recipe.superLikeCount}">0</span>
                    </span>
                </div>

                <!-- Auteur cliquable, en bas à droite -->
                <a th:if="${recipe.authorUsername != null}"
                   th:href="@{/profile/{username}(username=${recipe.authorUsername})}"
                   class="relative z-10 text-sm text-secondary-400 hover:text-primary-500 transition font-medium"
                   th:text="${recipe.authorUsername}">
                    Auteur
                </a>
            </div>
        </div>
    </div>

    <!-- Lien etiré couvrant toute la carte (z-0, sous le lien auteur) -->
    <a th:href="@{/recipes/{id}(id=${recipe.id})}"
       class="absolute inset-0 z-0 rounded-2xl"
       aria-label="Voir la recette"></a>
</div>

</body>
</html>
