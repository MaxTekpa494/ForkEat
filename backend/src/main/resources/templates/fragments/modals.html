<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<!-- Fragment : modale de confirmation Super Like
     Paramètres : modalId, contentId, onConfirm, onCancel, onBackdrop -->
<div th:fragment="superLikeModal(modalId, contentId, onConfirm, onCancel, onBackdrop, superLikeBasePriceCents, superLikePromoPriceCents)"
     th:id="${modalId}"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm"
     th:attr="onclick=${onBackdrop}">
    <div th:id="${contentId}"
         class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4 transform transition-all duration-200 scale-95 opacity-0">
        <div class="flex flex-col items-center text-center gap-4">
            <div class="w-14 h-14 rounded-full bg-yellow-50 flex items-center justify-center">
                <svg width="64px" height="64px" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient th:id="${modalId} + '-g'" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" style="stop-color:#FFED8B;stop-opacity:1" />
                            <stop offset="50%" style="stop-color:#FFC837;stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#DAA520;stop-opacity:1" />
                        </linearGradient>
                        <filter th:id="${modalId} + '-f'" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="0" dy="2" stdDeviation="1" flood-color="#B8860B" flood-opacity="0.3"/>
                        </filter>
                    </defs>
                    <g th:attr="filter='url(#' + ${modalId} + '-f)'">
                        <path th:attr="fill='url(#' + ${modalId} + '-g)'"
                              d="M12 3C9.5 3 7.5 4.5 7 6.5C4.5 6.5 2.5 8.5 2.5 11C2.5 13.5 4.5 15.5 7 15.5H17C19.5 15.5 21.5 13.5 21.5 11C21.5 8.5 19.5 6.5 17 6.5C16.5 4.5 14.5 3 12 3Z"
                              stroke="#B8860B"/>
                        <path th:attr="fill='url(#' + ${modalId} + '-g)'"
                              d="M7 16.5H17C17.55 16.5 18 16.95 18 17.5V19.5C18 20.05 17.55 20.5 17 20.5H7C6.45 20.5 6 20.05 6 19.5V17.5C6 16.95 6.45 16.5 7 16.5Z"
                              stroke="#B8860B"/>
                    </g>
                    <path d="M19 2L19.5 3.5L21 4L19.5 4.5L19 6L18.5 4.5L17 4L18.5 3.5L19 2Z" fill="#FFED8B" stroke="#B8860B"/>
                </svg>
            </div>
            <div>
                <h3 class="text-gray-800 font-semibold text-lg">Super Like cette recette ?</h3>
                <p class="text-gray-500 text-sm mt-1">Vous allez mettre en avant cette recette avec un Super Like.</p>
                <div class="flex items-center justify-center gap-2 mt-2">
                    <span th:if="${superLikeBasePriceCents != null and superLikePromoPriceCents != null}"
                          class="line-through text-gray-300 text-sm"
                          th:text="${#numbers.formatDecimal(superLikeBasePriceCents / 100.0, 1, 2) + '€'}"></span>
                    <span th:if="${superLikePromoPriceCents != null}"
                          class="text-yellow-600 font-bold text-base"
                          th:text="${#numbers.formatDecimal(superLikePromoPriceCents / 100.0, 1, 2) + '€'}"></span>
                    <span th:if="${superLikeBasePriceCents != null and superLikePromoPriceCents == null}"
                          class="text-gray-700 font-semibold text-sm"
                          th:text="${#numbers.formatDecimal(superLikeBasePriceCents / 100.0, 1, 2) + '€'}"></span>
                </div>
            </div>
            <div class="flex gap-3 w-full mt-2">
                <button th:attr="onclick=${onCancel}"
                        class="flex-1 px-4 py-2 rounded-full border border-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-50 transition-colors duration-150">
                    Annuler
                </button>
                <button th:attr="onclick=${onConfirm}"
                        class="flex-1 px-4 py-2 rounded-full bg-yellow-400 hover:bg-yellow-500 text-white text-sm font-semibold transition-colors duration-150">
                    Confirmer
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Fragment : modale fonds insuffisants
     Paramètres : modalId, contentId, onCancel, message -->
<div th:fragment="insufficientFundsModal(modalId, contentId, onCancel, message)"
     th:id="${modalId}"
     class="fixed inset-0 z-50 hidden items-center justify-center bg-black/40 backdrop-blur-sm">
    <div th:id="${contentId}"
         class="bg-white rounded-2xl shadow-xl p-6 max-w-sm w-full mx-4 transform transition-all duration-200 scale-95 opacity-0">
        <div class="flex flex-col items-center text-center gap-4">
            <div class="w-14 h-14 rounded-full bg-red-50 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8 text-red-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
                </svg>
            </div>
            <div>
                <h3 class="text-gray-800 font-semibold text-lg">Solde insuffisant</h3>
                <p class="text-gray-500 text-sm mt-1" th:text="${message}"></p>
            </div>
            <div class="flex gap-3 w-full mt-2">
                <button th:attr="onclick=${onCancel}"
                        class="flex-1 px-4 py-2 rounded-full border border-gray-200 text-gray-500 text-sm font-medium hover:bg-gray-50 transition-colors duration-150">
                    Annuler
                </button>
                <a href="/wallet"
                   class="flex-1 px-4 py-2 rounded-full bg-primary-500 hover:bg-primary-600 text-white text-sm font-semibold text-center transition-colors duration-150">
                    Recharger mon wallet
                </a>
            </div>
        </div>
    </div>
</div>

<!-- Fragment : modale de rejet recette ave justification -->
<div th:fragment="ModerationRejectModal(modalId, formId)"
     th:id="${modalId}"
     class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40 hidden">
    <div class="bg-white rounded-2xl shadow-lg p-8 w-full max-w-md relative">
        <button type="button" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-2xl" onclick="closeRejectModal()">&times;</button>
        <h3 class="font-display font-bold text-lg mb-4 text-secondary-900">Rejeter la recette</h3>
        <form th:id="${formId}" th:action="@{/}" method="post" onsubmit="return validateJustificationField(this);">
            <input type="hidden" name="recipeId" value="" />
            <div class="mb-4">
                <label for="justification" class="block text-sm font-medium text-gray-700 mb-1">Motif du rejet <span class="text-red-500">*</span></label>
                <textarea id="justification" name="justification" rows="3" required class="w-full border border-gray-200 rounded-lg p-2 focus:outline-none focus:ring-2 focus:ring-red-200"></textarea>
                <p id="justification-error" class="text-red-500 text-xs mt-1 hidden">Le motif ne peut pas être vide.</p>
            </div>
            <div class="flex justify-end gap-3">
                <button type="button" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg font-medium" onclick="closeRejectModal()">Annuler</button>
                <button type="submit" class="px-5 py-2 bg-red-500 hover:bg-red-400 text-white rounded-lg font-semibold shadow-md shadow-red-500/30">Rejeter</button>
            </div>
        </form>
        <script>
        function validateJustificationField(form) {
            const textarea = form.querySelector('#justification');
            const error = form.querySelector('#justification-error');
            const trimmed = textarea.value.trim();
            if (!trimmed) {
                error.classList.remove('hidden');
                textarea.classList.add('border-red-400');
                textarea.focus();
                return false;
            } else {
                error.classList.add('hidden');
                textarea.classList.remove('border-red-400');
                textarea.value = trimmed; // Trim avant envoi
                return true;
            }
        }
        </script>
    </div>
</div>
</body>
</html>
