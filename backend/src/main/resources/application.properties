spring.application.name=ForkEat

# Server
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration

# Neo4j
spring.neo4j.uri=bolt://localhost:7687
spring.neo4j.authentication.username=${NEO4J_USER}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
spring.data.neo4j.database=neo4j

# Debezium Embedded
debezium.offset-storage-file=./debezium-offsets.dat
debezium.database.hostname=localhost
debezium.database.port=5432
debezium.database.user=${POSTGRES_USER}
debezium.database.password=${POSTGRES_PASSWORD}
debezium.database.dbname=${POSTGRES_DB}

# Logging
logging.level.root=INFO
logging.level.fr.uge.forkeat=DEBUG
logging.level.org.flywaydb=INFO
logging.level.io.debezium=INFO
logging.level.fr.uge.forkeat.infrastructure.persistence.sync.cdc=DEBUG


# --- STRIPE ---
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# --- APPLICATION ---
app.front.url=http://localhost:4200