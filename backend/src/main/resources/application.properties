spring.application.name=ForkEat

app.admin.password=${ADMIN_PASSWORD}
app.admin.username=admin

# Server
server.port=8080
server.servlet.session.persistent=false
spring.threads.virtual.enabled=true

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${POSTGRES_URL:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB}?stringtype=unspecified
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.out-of-order=true
spring.flyway.placeholders.system_earnings_password_hash=${SYSTEM_EARNINGS_PASSWORD_HASH}

# Neo4j
spring.neo4j.uri=bolt://${NEO4J_BOLT_URL:localhost:7687}
spring.neo4j.authentication.username=${NEO4J_USER}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}

# Debezium Embedded
# Active ou desactive le moteur Debezium (false en test pour ne pas demarrer le CDC)
debezium.enabled=true
# Fichier local ou Debezium persiste sa position de lecture dans le WAL PostgreSQL (offset)
# Permet de reprendre la ou il s'etait arrete apres un redemarrage
debezium.offset-storage-file=./debezium-offsets.dat

# Connecteur
# Nom unique de cette instance de connecteur
debezium.connector.name=forkeat-postgres-connector
# Classe du connecteur Debezium a utiliser (ici PostgreSQL)
debezium.connector.class=io.debezium.connector.postgresql.PostgresConnector

# Offset
# Implementation de stockage des offsets (ici fichier local, Kafka peut aussi etre utilise)
debezium.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
# Intervalle en ms entre deux flush de l'offset sur disque
debezium.offset.flush.interval.ms=1000

# Connexion PostgreSQL
debezium.database.hostname=${POSTGRES_URL:localhost}
debezium.database.port=${POSTGRES_PORT:5432}
debezium.database.user=${POSTGRES_USER}
debezium.database.password=${POSTGRES_PASSWORD}
debezium.database.dbname=${POSTGRES_DB}
# Nom logique du serveur, utilise comme prefixe dans les noms de topics internes Debezium
debezium.database.server.name=forkeat

# CDC
# Prefixe des topics Debezium (sans Kafka ici, mais requis par le connecteur)
debezium.topic.prefix=forkeat
# Tables PostgreSQL surveillees (format schema.table, separees par des virgules)
debezium.table.include.list=public.users,public.recipes,public.super_likes
# Plugin de decodage logique PostgreSQL (pgoutput est natif depuis PG 10, prefere a decoderbufs)
debezium.plugin.name=pgoutput
# Mode de creation de la publication PostgreSQL : filtered = uniquement les tables de table.include.list
debezium.publication.autocreate.mode=filtered
# Nom du slot de replication PostgreSQL (doit etre unique par instance Debezium)
debezium.slot.name=forkeat_slot
# Stockage de l'historique du schema (MemorySchemaHistory = en memoire, ne survit pas aux redemarrages)
debezium.schema.history.internal=io.debezium.relational.history.MemorySchemaHistory
# Mode snapshot au demarrage : initial = capture l'etat existant des tables puis passe en streaming
debezium.snapshot.mode=initial

# Logging
logging.level.root=INFO
logging.level.fr.uge.forkeat=DEBUG
logging.level.org.flywaydb=INFO

# Multipart (file uploads)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
server.tomcat.max-swallow-size=-1
server.tomcat.max-parameter-count=1000
server.tomcat.max-http-form-post-size=-1
spring.mvc.async.request-timeout=-1
spring.servlet.multipart.location=./uploads
logging.level.org.springframework.web=DEBUG
server.tomcat.max-part-count=100
server.tomcat.max-part-header-size=2048

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- APPLICATION ---
#app.front.url=http://localhost:4200
app.system.earnings.username=${SYSTEM_EARNINGS_USERNAME:ForkEat}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000
app.base-url=${BASE_PROTOCOL:http}://${BASE_URL:localhost}${BASE_PORT::8080}
app.email.confirmation-expiry-hours = 24
app.email.code-expiry-minutes = 10

# --- APPLICATION URLS ---
# MVC
app.webSuccessUrl=${app.base-url}/wallet?payment=success
app.webCancelUrl=${app.base-url}/wallet?payment=cancel
# ANDROID
app.androidSuccessUrl=forkeat://wallet?payment=success
app.androidCancelUrl=forkeat://wallet?payment=cancel

# OAUTH2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=forkeat.noreply@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- R2 Storage ---
#cloudflare.r2.account.id: ${CLOUDFLARE_ACCOUNT_ID}
cloudflare.r2.access.key.id: ${R2_ACCESS_KEY_ID}
cloudflare.r2.secret.access.key: ${R2_SECRET_ACCESS_KEY}
cloudflare.r2.bucket.name: forkeat-images
cloudflare.r2.endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
cloudflare.r2.public.url= ${R2_PUBLIC_URL:https://pub-xxxxx.r2.dev}
cloudflare-r2-limit-size-image: 5

# ==============================
# STRIPE GLOBAL
# ==============================
stripe.api.key=${STRIPE_API_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# ==============================
# STRIPE CONNECT CONFIG
# ==============================
stripe.connect.country=FR
stripe.connect.mcc=5814
stripe.connect.business-type=individual
stripe.connect.tos-accepted=true



# ==============================
# STRIPE TEST VALUES (TEST MODE ONLY)
# ==============================
stripe.test.dob.day=1
stripe.test.dob.month=1
stripe.test.dob.year=1902

stripe.test.address.line1=address_full_match
stripe.test.address.city=Paris
stripe.test.address.postal-code=75001
stripe.test.address.country=FR

stripe.test.document.front=file_identity_document_success


# ---- SPRING AI : OLLAMA
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11435}

spring.ai.ollama.embedding.options.model=bge-m3


spring.ai.ollama.chat.options.model=llama-guard3:1b

spring.ai.ollama.init.pull-model-strategy=never

# Embedding model
spring.ai.ollama.embedding.options.num-g-p-u=99

# Chat model
spring.ai.ollama.chat.options.num-g-p-u=99

# ---- RAG : Configuration
app.rag.top-k=10
app.rag.ef-search=100

app.rag.moderation.min-length=3
app.rag.moderation.max-length=500
app.rag.moderation.llm-timeout-seconds=20
app.rag.embedding.timeout-seconds=10
app.rag.smart-search-cost=10

# Spring AI : desactive les retries bloquants (un Echec Ollama ne doit pas doubler la latence)
spring.ai.retry.max-attempts=1

# Pour scaler Ollama : pointer OLLAMA_BASE_URL vers un load balancer (nginx/HAProxy)
# devant plusieurs instances Ollama. Ex: OLLAMA_BASE_URL=http://ollama-lb:11435
spring.task.scheduling.time-zone=Europe/Paris

